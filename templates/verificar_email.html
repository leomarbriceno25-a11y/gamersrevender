{% extends 'base.html' %}
{% block title %}Verificar correo - {{ tienda_nombre }}{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-envelope-open-text"></i></div>
        <h1>Verifica tu correo</h1>
        <p class="auth-subtitle">Ingresa el código de 6 dígitos que enviamos a <strong>{{ email }}</strong>.</p>
        <form method="POST">
            <input type="hidden" name="email" value="{{ email }}">
            <div class="form-group">
                <label><i class="fas fa-key"></i> Código de verificación</label>
                <input type="text" name="codigo" placeholder="123456" maxlength="10" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-check-circle"></i> Verificar correo</button>
        </form>
        <form method="POST" action="{{ url_for('reenviar_verificacion') }}" style="margin-top:1rem;">
            <input type="hidden" name="email" value="{{ email }}">
            <button type="submit" class="btn btn-sm btn-outline btn-block" style="background:transparent;border:1px solid var(--border);color:var(--text-secondary);"><i class="fas fa-redo"></i> Reenviar código</button>
        </form>
        <p class="auth-link">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
    </div>
</section>
{% endblock %}
