{% extends 'base.html' %}
{% block title %}Restablecer contraseña - {{ tienda_nombre }}{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-lock"></i></div>
        <h1>Nueva contraseña</h1>
        <p class="auth-subtitle">Ingresa tu nueva contraseña.</p>
        <form method="POST">
            <input type="hidden" name="token" value="{{ token }}">
            <div class="form-group">
                <label><i class="fas fa-key"></i> Nueva contraseña</label>
                <input type="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-save"></i> Guardar contraseña</button>
        </form>
        <p class="auth-link"><a href="{{ url_for('login') }}">Volver al inicio de sesión</a></p>
    </div>
</section>
{% endblock %}
