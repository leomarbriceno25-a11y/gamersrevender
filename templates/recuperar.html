{% extends 'base.html' %}
{% block title %}Recuperar contraseña - {{ tienda_nombre }}{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-logo"><i class="fas fa-unlock-alt"></i></div>
        <h1>Recuperar contraseña</h1>
        <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.</p>
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Correo electrónico</label>
                <input type="email" name="email" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block"><i class="fas fa-paper-plane"></i> Enviar instrucciones</button>
        </form>
        <p class="auth-link"><a href="{{ url_for('login') }}">Volver al inicio de sesión</a></p>
    </div>
</section>
{% endblock %}
